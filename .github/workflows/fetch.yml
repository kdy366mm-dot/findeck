name: Fetch market data

on:
  schedule:
    # every 5 min, 08:30–16:25 IST, Mon–Fri  (cron is UTC; IST = UTC+5:30)
    - cron: '*/5 3-10 * * 1-5'
    # a couple of evening runs to catch US close
    - cron: '0 17,21 * * 1-5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data
        run: node scripts/fetch.js

      - name: Commit if changed
        run: |
          git config user.name  "findeck-bot"
          git config user.email "actions@github.com"
          git add data/market.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
