name: Fetch market data

on:
  schedule:
    # every 10 minutes, 08:30-17:30 IST, Monday to Friday
    - cron: '*/10 3-12 * * 1-5'
  workflow_dispatch:        # gives you a manual "Run" button

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch all sources
        run: node scripts/fetch.js

      - name: Save results
        run: |
          git config user.name  "findeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --quiet --cached; then
            echo "no change"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
